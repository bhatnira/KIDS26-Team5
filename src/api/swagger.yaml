basePath: /api/v1
definitions:
  agent.AttachmentRef:
    properties:
      bucket:
        type: string
      key:
        type: string
      mime_type:
        type: string
      name:
        type: string
      size:
        type: integer
      staged_path:
        description: |-
          StagedPath is the workspace-relative path the file is staged at. The
          chat service pins it (from StagedInputPaths) before building the user
          message, so the staged location and the message manifest can never
          drift — and so attachments restored from earlier turns (see
          SessionStateStagedAttachments) keep the path their manifest advertised.
          Empty means "compute from StagedInputPaths".
        type: string
    type: object
  agent.MCPConfigDto:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      headers:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      server_url:
        type: string
      timeout_seconds:
        type: integer
      transport:
        type: string
    type: object
  agent.WorkspaceConfigDto:
    properties:
      bucket:
        type: string
      daytona_api_key:
        type: string
      daytona_api_url:
        type: string
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  models.AuthProviderType:
    enum:
    - basic
    - ldap
    - oidc
    type: string
    x-enum-varnames:
    - AuthProviderBasic
    - AuthProviderLDAP
    - AuthProviderOIDC
  models.JobTemplate:
    properties:
      createdAt:
        type: string
      defaults:
        description: Default meta/env as JSON
        type: string
      deletedAt:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      engine:
        description: '"nextflow", "wdl", "script"'
        type: string
      hcl_template:
        type: string
      id:
        type: integer
      is_built_in:
        type: boolean
      name:
        type: string
      schema:
        description: JSON Schema for params validation
        type: string
      updatedAt:
        type: string
      version:
        type: string
    type: object
  types.APIKeyGenerateDto:
    properties:
      expire_days:
        maximum: 365
        minimum: 1
        type: integer
      name:
        type: string
    required:
    - expire_days
    - name
    type: object
  types.AuthProviderAddDto:
    properties:
      display_name:
        type: string
      enabled:
        type: boolean
      ldap_base_dn:
        type: string
      ldap_bind_dn:
        type: string
      ldap_bind_pass:
        type: string
      ldap_filter:
        type: string
      ldap_tls_cert:
        type: string
      ldap_url:
        description: LDAP fields
        type: string
      name:
        type: string
      oidc_client_id:
        type: string
      oidc_client_secret:
        type: string
      oidc_issuer_url:
        description: OIDC fields
        type: string
      oidc_redirect_url:
        type: string
      priority:
        type: integer
      type:
        $ref: '#/definitions/models.AuthProviderType'
    required:
    - name
    - type
    type: object
  types.AuthProviderUpdateDto:
    properties:
      display_name:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      ldap_base_dn:
        type: string
      ldap_bind_dn:
        type: string
      ldap_bind_pass:
        description: Only update if not empty
        type: string
      ldap_filter:
        type: string
      ldap_tls_cert:
        type: string
      ldap_url:
        description: LDAP fields
        type: string
      name:
        type: string
      oidc_client_id:
        type: string
      oidc_client_secret:
        description: Only update if not empty
        type: string
      oidc_issuer_url:
        description: OIDC fields
        type: string
      oidc_redirect_url:
        type: string
      priority:
        type: integer
      type:
        $ref: '#/definitions/models.AuthProviderType'
    required:
    - id
    - name
    - type
    type: object
  types.ChangePasswordDto:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  types.CreateBucketReqDto:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  types.EmailDto:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  types.JobAddDto:
    properties:
      pipeline_name:
        type: string
      pipeline_params:
        items:
          type: integer
        type: array
      pipeline_version:
        type: string
      user_id:
        type: integer
    required:
    - pipeline_name
    - pipeline_params
    - pipeline_version
    type: object
  types.JobDeleteDto:
    properties:
      job_id:
        type: integer
      user_id:
        type: integer
    required:
    - job_id
    type: object
  types.JobStopDto:
    properties:
      job_id:
        type: integer
      user_id:
        type: integer
    required:
    - job_id
    type: object
  types.LLMConfigAddDto:
    properties:
      api_key:
        type: string
      base_url:
        type: string
      insecure_skip_verify:
        type: boolean
      is_default:
        type: boolean
      max_tokens:
        type: integer
      model:
        type: string
      name:
        type: string
      provider:
        type: string
      temperature:
        type: number
      thinking_effort:
        type: string
      thinking_enabled:
        type: boolean
    required:
    - api_key
    - model
    - name
    - provider
    type: object
  types.LLMTestConnectionDto:
    properties:
      api_key:
        type: string
      base_url:
        type: string
      insecure_skip_verify:
        type: boolean
      max_tokens:
        type: integer
      model:
        type: string
      provider:
        type: string
      temperature:
        type: number
      thinking_effort:
        type: string
      thinking_enabled:
        type: boolean
    required:
    - api_key
    - model
    - provider
    type: object
  types.LdapLoginDto:
    properties:
      password:
        type: string
      provider:
        description: Provider name
        type: string
      username:
        type: string
    required:
    - password
    - provider
    - username
    type: object
  types.LoginDto:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  types.OidcCallbackDto:
    properties:
      code:
        type: string
      state:
        type: string
    required:
    - code
    - state
    type: object
  types.PipelineAddDto:
    properties:
      author:
        type: string
      description:
        type: string
      name:
        type: string
      repository:
        type: string
      version:
        type: string
    required:
    - name
    - repository
    - version
    type: object
  types.PipelineDeleteDto:
    properties:
      name:
        type: string
      version:
        type: string
    required:
    - name
    - version
    type: object
  types.PresignedURLReqDto:
    properties:
      bucket:
        type: string
      key:
        type: string
    required:
    - bucket
    - key
    type: object
  types.RegisterDto:
    properties:
      code:
        type: string
      email:
        type: string
      password:
        type: string
    required:
    - code
    - email
    - password
    type: object
  types.ResetPasswordDto:
    properties:
      code:
        type: string
      email:
        type: string
      password:
        type: string
    required:
    - code
    - email
    - password
    type: object
  types.TestStorageConnectionDto:
    properties:
      access_key:
        type: string
      host:
        type: string
      insecure_skip_verify:
        type: boolean
      port:
        maximum: 65535
        minimum: 1
        type: integer
      region:
        type: string
      secret_key:
        type: string
      use_ssl:
        type: boolean
    required:
    - access_key
    - host
    - port
    - secret_key
    type: object
  types.UpdateTokenDto:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  types.UserAddDto:
    properties:
      department:
        type: string
      email:
        type: string
      group:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
      status:
        maximum: 1
        minimum: 0
        type: integer
    required:
    - department
    - email
    - group
    - name
    - password
    - role
    type: object
  types.UserEditDto:
    properties:
      department:
        type: string
      email:
        type: string
      group:
        type: string
      name:
        type: string
      role:
        type: string
      status:
        maximum: 1
        minimum: 0
        type: integer
    required:
    - department
    - email
    - group
    - name
    - role
    type: object
  types.UserStorageConfigDto:
    properties:
      access_key:
        type: string
      host:
        type: string
      insecure_skip_verify:
        type: boolean
      port:
        maximum: 65535
        minimum: 1
        type: integer
      region:
        type: string
      secret_key:
        type: string
      use_ssl:
        type: boolean
    required:
    - access_key
    - host
    - port
    - secret_key
    type: object
  types.UserUpdateProfileDto:
    properties:
      department:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  v1.conversationCreateDto:
    properties:
      title:
        type: string
    type: object
  v1.sendMessageDto:
    properties:
      attachments:
        items:
          $ref: '#/definitions/agent.AttachmentRef'
        type: array
      content:
        type: string
    type: object
host: localhost:8086
info:
  contact:
    name: Antelope Team
  description: Antelope bioinformatics pipeline management platform API.
  license:
    name: MIT
  title: Antelope API
  version: "1.0"
paths:
  /admin/dashboard/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Admin dashboard stats
      tags:
      - dashboard
  /agent/mcp-configs:
    get:
      description: List MCP configs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List MCP configs
      tags:
      - agent
    post:
      consumes:
      - application/json
      description: Add MCP config
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/agent.MCPConfigDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Add MCP config
      tags:
      - agent
  /agent/mcp-configs/{id}:
    delete:
      description: Delete MCP config
      parameters:
      - description: MCP config ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete MCP config
      tags:
      - agent
    put:
      consumes:
      - application/json
      description: Update MCP config
      parameters:
      - description: MCP config ID
        in: path
        name: id
        required: true
        type: string
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/agent.MCPConfigDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update MCP config
      tags:
      - agent
  /agent/sessions/{id}/artifacts:
    get:
      description: List session artifacts
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List session artifacts
      tags:
      - agent
  /agent/sessions/{id}/artifacts/{key}:
    get:
      description: Download session artifact
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      - description: Artifact key
        in: path
        name: key
        required: true
        type: string
      - description: Artifact version
        in: query
        name: version
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Download session artifact
      tags:
      - agent
  /agent/skills:
    get:
      description: |-
        List the built-in skill library plus the caller's own skills.
        The built-in library is ~700 skills, so results are filtered and
        paged server-side; the response also carries the domain facets and
        the loaded library's provenance.
      parameters:
      - description: Free-text match on name, description, domain and tags
        in: query
        name: search
        type: string
      - description: Restrict to one domain
        in: query
        name: domain
        type: string
      - description: Restrict to built-in or user skills
        enum:
        - global
        - user
        in: query
        name: scope
        type: string
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Page offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List skills
      tags:
      - agent
  /agent/skills/{name}:
    get:
      description: Get skill
      parameters:
      - description: Skill name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get skill
      tags:
      - agent
  /agent/workspace-config:
    get:
      description: Get workspace config
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get workspace config
      tags:
      - agent
    put:
      consumes:
      - application/json
      description: Update workspace config
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/agent.WorkspaceConfigDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update workspace config
      tags:
      - agent
  /auth/ldap/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user via LDAP
      parameters:
      - description: LDAP credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.LdapLoginDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: LDAP login
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user with email and password
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.LoginDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Local login
      tags:
      - auth
  /auth/logout:
    post:
      description: Log out the current user and invalidate the session
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/oidc/{provider}/start:
    get:
      description: Mint a one-time state nonce and return the provider authorization
        URL to redirect to
      parameters:
      - description: Provider name
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Start OIDC login
      tags:
      - auth
  /auth/oidc/callback:
    post:
      consumes:
      - application/json
      description: Handle the OIDC provider callback and complete authentication
      parameters:
      - description: OIDC callback payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.OidcCallbackDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: OIDC callback
      tags:
      - auth
  /auth/providers:
    get:
      description: Get the list of currently enabled authentication providers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: List enabled auth providers
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Obtain a new access token using a refresh token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/types.UpdateTokenDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - auth
  /cab/fastqQuery:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Proxy FASTQ query to CAB
      tags:
      - proxy
  /cab/pipeline:
    post:
      consumes:
      - application/json
      parameters:
      - description: Pipeline submit payload
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Proxy pipeline submit to CAB
      tags:
      - proxy
  /chat/conversations:
    get:
      description: List conversations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List conversations
      tags:
      - chat
    post:
      consumes:
      - application/json
      description: Create conversation
      parameters:
      - description: Request body
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/v1.conversationCreateDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create conversation
      tags:
      - chat
  /chat/conversations/{id}:
    delete:
      description: Delete conversation
      parameters:
      - description: Conversation ID
        in: path
        name: id
        required: true
        type: string
      produces:
